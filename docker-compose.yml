services:
  cangmo:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      CANGMO_HOST: 0.0.0.0
      CANGMO_PORT: 8080
      CANGMO_DATA_DIR: /app/data
      CANGMO_SITE_URL: http://localhost:8080
      CANGMO_SETUP_TOKEN: change-me-before-first-run
      CANGMO_BACKUP_PASSPHRASE: change-me-at-least-12-chars
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
