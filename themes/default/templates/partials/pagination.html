{% if pagination.pages > 1 %}
<nav class="pagination" aria-label="分页">
  {% if pagination.prev_url %}<a class="page-prev" href="{{ pagination.prev_url }}" rel="prev">上一页</a>{% else %}<span class="page-prev disabled">上一页</span>{% endif %}
  <span class="page-numbers">
    {% for item in pagination.numbers %}
      {% if item.current %}<span class="page-number current" aria-current="page">{{ item.number }}</span>{% else %}<a class="page-number" href="{{ item.url }}">{{ item.number }}</a>{% endif %}
    {% endfor %}
  </span>
  {% if pagination.next_url %}<a class="page-next" href="{{ pagination.next_url }}" rel="next">下一页</a>{% else %}<span class="page-next disabled">下一页</span>{% endif %}
</nav>
{% endif %}
