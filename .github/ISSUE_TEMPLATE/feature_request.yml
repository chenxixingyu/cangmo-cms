name: Feature request / 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先查看 [FEATURES.md](https://github.com/chenxixingyu/cangmo-cms/blob/main/docs/FEATURES.md) 与已有 Issue。
        功能建议越具体，越容易评估。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不方便？谁会受益？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望如何工作？是否有替代方案？
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 所属模块
      options:
        - 内容/编辑
        - 评论
        - 媒体
        - 主题/展示
        - 用户/权限
        - 安全
        - API
        - 运维/备份
        - 文档
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR
        - label: 我可以提供测试环境
