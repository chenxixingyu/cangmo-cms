name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: auto

      - name: Show toolchain versions
        shell: pwsh
        run: |
          cjc --version
          cjpm --version

      - name: Build
        shell: pwsh
        run: cjpm build

      - name: Unit tests
        shell: pwsh
        run: cjpm test
