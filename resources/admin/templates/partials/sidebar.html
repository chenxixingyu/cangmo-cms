<aside class="admin-sidebar" id="admin-sidebar">
  <a class="admin-brand" href="/admin">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="4" width="24" height="24" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 11h12M10 16h12M10 21h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>仓墨</span>
  </a>
  <nav class="admin-nav" aria-label="后台导航">
    <a href="/admin" class="{% if active == "dashboard" %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h7V4H4v9Zm9 7h7V11h-7v9ZM4 20h7v-4H4v4Zm9-13h7V4h-7v3Z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      仪表盘
    </a>
    <a href="/admin/posts" class="{% if active == "posts" %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5V4Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10h8M8 14h8M8 18h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      文章
    </a>
    <a href="/admin/posts?type=page" class="{% if active == "pages" %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6V3Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 12h7M9 16h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      页面
    </a>
    <a href="/admin/comments" class="{% if active == "comments" %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      评论{% if pending_comments > 0 %}<span class="nav-badge">{{ pending_comments }}</span>{% endif %}
    </a>
    <a href="/admin/media" class="{% if active == "media" %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      媒体库
    </a>
    <a href="/admin/categories" class="{% if active == "categories" %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3V6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      分类
    </a>
    <a href="/admin/tags" class="{% if active == "tags" %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 8-8 8 8-8 8-8-8Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="9" r="1.5" fill="currentColor"/></svg>
      标签
    </a>
    {% if is_admin %}
    <a href="/admin/users" class="{% if active == "users" %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      用户
    </a>
    {% endif %}
    <div class="nav-sep"></div>
    {% if is_admin %}
    <a href="/admin/settings" class="{% if active == "settings" %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      设置
    </a>
    <a href="/admin/themes" class="{% if active == "themes" %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1.5a2.5 2.5 0 0 0 0-5H12a2 2 0 0 1 0-4h4a5 5 0 0 0 0-10h-4Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7.5" cy="10" r="1" fill="currentColor"/><circle cx="9.5" cy="6.5" r="1" fill="currentColor"/></svg>
      主题
    </a>
    <a href="/admin/audit" class="{% if active == "audit" %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5V3Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      审计日志
    </a>
    <a href="/admin/tools" class="{% if active == "tools" %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v13H4V7Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 7V4h8v3M4 12h16" stroke="currentColor" stroke-width="1.8"/></svg>
      工具与备份
    </a>
    {% endif %}
    <a href="/admin/profile" class="{% if active == "profile" %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      个人资料
    </a>
  </nav>
  <div class="admin-sidebar-foot">
    <a href="/" target="_blank" rel="noopener">查看站点 ↗</a>
    <form method="post" action="/admin/logout">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <button type="submit" class="link-btn">退出登录</button>
    </form>
  </div>
</aside>
