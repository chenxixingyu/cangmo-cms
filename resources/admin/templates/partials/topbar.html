<header class="admin-topbar">
  <button class="admin-nav-toggle" id="admin-nav-toggle" type="button" aria-label="切换菜单" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <h1>{{ page_title }}</h1>
  <div class="topbar-actions">
    <form method="post" action="/admin/site/switch" class="site-switch">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <input type="hidden" name="return_to" value="/admin">
      <select name="site_id" aria-label="切换站点" onchange="this.form.submit()">
        {% for item in admin_sites %}<option value="{{ item.id }}"{% if item.selected %} selected{% endif %}>{{ item.name }}</option>{% endfor %}
      </select>
    </form>
    <button class="topbar-command" id="command-open" type="button" aria-haspopup="dialog">
      <span>搜索或跳转</span><kbd>Ctrl K</kbd>
    </button>
    <a class="topbar-link" href="/admin/posts/new">写文章</a>
    <details class="user-menu">
      <summary class="user-chip">
        {% if user.avatar %}<img class="avatar avatar-img" src="{{ user.avatar }}" alt="">{% else %}<span class="avatar">{{ user.initial }}</span>{% endif %}
        <span class="topbar-user">{{ user.display_name|default(user.username) }}</span>
      </summary>
      <div class="user-menu-pop">
        <a href="/admin/profile">个人资料</a>
        <a href="/admin">仪表盘</a>
        <form method="post" action="/admin/logout">
          <input type="hidden" name="_csrf" value="{{ csrf }}">
          <button type="submit" class="link-btn">退出登录</button>
        </form>
      </div>
    </details>
  </div>
</header>
<dialog class="command-dialog" id="command-dialog" aria-labelledby="command-title">
  <div class="command-head">
    <h2 id="command-title">搜索或跳转</h2>
    <button type="button" class="link-btn" data-close-dialog>Esc</button>
  </div>
  <input type="search" id="command-input" placeholder="搜索页面、操作…" autocomplete="off" aria-label="搜索页面或操作">
  <div class="command-list" id="command-list"></div>
</dialog>
{% if flash.length > 0 %}
<div class="toast-stack" role="status" aria-live="polite">
  {% for message in flash %}<div class="toast toast-{{ message.kind }}">{{ message.text }}</div>{% endfor %}
</div>
{% endif %}
