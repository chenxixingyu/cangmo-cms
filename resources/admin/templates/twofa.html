{% include "partials/head.html" %}
<main class="auth-wrap">
  <section class="auth-card">
    <div class="auth-brand">
      <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#2f6f4e"/><path d="M32 12l16 7v12c0 11-7 18-16 21-9-3-16-10-16-21V19l16-7Z" fill="#f7f5ef"/><path d="M25 32l5 5 10-11" fill="none" stroke="#2f6f4e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><strong>两步验证</strong><span>{{ site.title }} 管理后台</span></div>
    </div>
    <h1>输入动态验证码</h1>
    <p class="auth-sub">打开验证器 App，输入 6 位验证码；也可以使用一枚恢复码。</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/2fa" class="auth-form">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <label>验证码
        <input type="text" name="code" required autofocus autocomplete="one-time-code" inputmode="numeric" maxlength="16" spellcheck="false">
      </label>
      <button class="btn btn-block" type="submit">验证并进入</button>
    </form>
    <p class="auth-foot"><a href="/admin/login">← 返回登录</a></p>
  </section>
</main>
{% include "partials/foot.html" %}
