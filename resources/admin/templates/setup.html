{% include "partials/head.html" %}
<main class="auth-wrap setup-wrap">
  <section class="auth-card setup-card">
    <div class="auth-brand">
      <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#2f6f4e"/><path d="M17 14h30a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H17a4 4 0 0 1-4-4V18a4 4 0 0 1 4-4Z" fill="#f7f5ef"/><path d="M23 23h18M23 31h18M23 39h11" stroke="#2f6f4e" stroke-width="3" stroke-linecap="round"/></svg>
      <div><strong>仓墨</strong><span>初始化向导</span></div>
    </div>
    <h1>创建你的站点</h1>
    <p class="auth-sub">这是第一次启动。完成初始化后即可开始写作。</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <div class="setup-note">
      <strong>初始化令牌</strong>
      <p>为了防止他人抢先注册，请输入服务端启动日志中打印的 Setup token。若使用环境变量 <code>CANGMO_SETUP_TOKEN</code>，请输入该值。</p>
    </div>
    <form method="post" action="/setup" class="auth-form">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <label>初始化令牌
        <input type="text" name="token" required autocomplete="off" spellcheck="false" placeholder="从控制台复制">
      </label>
      <label>站点标题
        <input type="text" name="site_title" value="{{ site_title }}" required maxlength="100">
      </label>
      <div class="form-grid">
        <label>管理员用户名
          <input type="text" name="username" value="{{ username }}" required minlength="3" maxlength="32" pattern="[A-Za-z][A-Za-z0-9_-]{2,31}" autocomplete="username">
        </label>
        <label>管理员邮箱
          <input type="email" name="email" value="{{ email }}" required maxlength="254" autocomplete="email">
        </label>
      </div>
      <div class="form-grid">
        <label>密码
          <input type="password" name="password" required minlength="10" autocomplete="new-password">
        </label>
        <label>确认密码
          <input type="password" name="password_confirm" required minlength="10" autocomplete="new-password">
        </label>
      </div>
      <p class="form-hint">密码至少 10 位，需包含字母、数字、符号中的两类。</p>
      <button class="btn btn-block" type="submit">完成初始化</button>
    </form>
  </section>
</main>
{% include "partials/foot.html" %}
